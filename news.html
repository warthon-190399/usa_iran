<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline de Eventos — EE.UU. vs Irán</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Timeline de Eventos — EE.UU. vs Irán">
  <meta property="og:description" content="Documentación cronológica del conflicto entre Estados Unidos e Irán. Registro editorial de hechos clave.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://warthon-190399.github.io/usa_iran/news.html">
  <meta property="og:image" content="https://warthon-190399.github.io/usa_iran/preview.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">

  <style>
    /* ── Variables (mismo sistema que index.html) ── */
    :root {
      --ink:        #0a0a0a;
      --cream:      #f5f0e8;
      --gold:       #d4a017;
      --red:        #c0392b;
      --muted:      rgba(245, 240, 232, 0.4);
      --border:     rgba(245, 240, 232, 0.07);
      --gold-dim:   rgba(212, 160, 23, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--ink);
      color: var(--cream);
      font-family: 'Source Serif 4', Georgia, serif;
      overflow-x: hidden;
      min-height: 100%;
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(10,10,10,0.95), transparent);
      pointer-events: none;
    }

    .nav-back {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Source Serif 4', serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-back:hover { color: var(--gold); }

    .nav-back svg {
      width: 14px; height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(245, 240, 232, 0.25);
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* ── PAGE WRAPPER ── */
    .page {
      min-height: 100vh;
      padding: 120px 0 100px;
    }

    /* Todos los bloques centrados con el mismo inner wrapper */
    .inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── HEADER ── */
    .page-header {
      margin-bottom: 64px;
    }

    .page-eyebrow {
      display: block;
      font-family: 'Source Serif 4', serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--cream);
      margin-bottom: 18px;
    }

    .page-title em {
      font-style: italic;
      color: var(--gold);
    }

    .page-subtitle {
      font-family: 'Source Serif 4', serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.65;
      max-width: 520px;
    }

    /* Línea decorativa */
    .page-rule {
      display: block;
      height: 1px;
      background: linear-gradient(to right, var(--gold) 56px, var(--border) 56px);
      margin-top: 36px;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 52px;
    }

    .counter {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .counter-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      transition: opacity 0.2s;
    }

    .counter-label {
      font-size: 0.88rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 18px;
      background: transparent;
      border: 1px solid rgba(245, 240, 232, 0.13);
      border-radius: 2px;
      font-family: 'Source Serif 4', serif;
      font-size: 0.76rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-btn.active {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
      font-weight: 600;
    }

    /* ── TIMELINE LIST ── */
    .timeline {
      position: relative;
    }

    /* Línea vertical izquierda */
    .timeline::before {
      content: '';
      position: absolute;
      left: 40px; /* alineado con el padding del .inner */
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(212, 160, 23, 0.22) 4%,
        rgba(212, 160, 23, 0.1) 92%,
        transparent
      );
      pointer-events: none;
    }

    /* ── TARJETA ── */
    .card {
      position: relative;
      padding: 36px 0 36px 60px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .card:first-child { padding-top: 4px; }
    .card:last-child  { border-bottom: none; }

    /* Punto en la línea */
    .card::before {
      content: '';
      position: absolute;
      left: calc(40px - 4px);
      top: 40px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(212, 160, 23, 0.25);
      border: 1px solid rgba(212, 160, 23, 0.4);
      transition: all 0.2s ease;
    }

    .card:first-child::before { top: 8px; }

    .card:hover::before,
    .card.open::before {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 160, 23, 0.4);
    }

    /* Badge destacado */
    .card.featured .card-meta::before {
      content: '★ Destacado';
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 8px;
    }

    /* Meta row */
    .card-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .card-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-date {
      font-size: 0.76rem;
      color: rgba(245, 240, 232, 0.28);
      letter-spacing: 0.04em;
    }

    .card-cat {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.75;
    }

    .card-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 2px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .card-status.breaking { background: rgba(192,57,43,0.1); color: #e74c3c; border: 1px solid rgba(192,57,43,0.2); }
    .card-status.urgent   { background: rgba(212,160,23,0.1); color: var(--gold); border: 1px solid rgba(212,160,23,0.2); }
    .card-status.update   { background: rgba(245,240,232,0.05); color: var(--muted); border: 1px solid rgba(245,240,232,0.1); }
    .card-status.analysis { background: rgba(80,130,255,0.07); color: #7aabff; border: 1px solid rgba(80,130,255,0.18); }

    /* Toggle btn */
    .card-toggle {
      width: 30px; height: 30px;
      border: 1px solid rgba(245,240,232,0.1);
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(245,240,232,0.3);
      font-size: 1rem;
      font-weight: 300;
      flex-shrink: 0;
      transition: all 0.22s ease;
      line-height: 1;
      padding: 0;
    }

    .card-toggle:hover    { border-color: var(--gold); color: var(--gold); }
    .card.open .card-toggle {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--ink);
      transform: rotate(45deg);
    }

    /* Título y resumen */
    .card-body  { padding-right: 48px; }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--cream);
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    .card:hover .card-title { color: var(--gold); }

    .card-summary {
      font-size: 0.9rem;
      line-height: 1.7;
      color: rgba(245,240,232,0.38);
    }

    /* Contenido expandido */
    .card-expanded {
      display: none;
      margin-top: 28px;
      padding-top: 24px;
      padding-right: 48px;
      border-top: 1px solid var(--border);
      animation: fadeIn 0.28s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card.open .card-expanded { display: block; }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.88;
      color: rgba(245,240,232,0.68);
    }

    .card-content p { margin-bottom: 1em; }
    .card-content p:last-child { margin-bottom: 0; }

    .card-img {
      width: 100%;
      height: auto;
      border-radius: 3px;
      margin: 20px 0;
      border: 1px solid var(--border);
      filter: grayscale(15%);
      display: block;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card-tag {
      padding: 4px 12px;
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(212,160,23,0.55);
      transition: all 0.2s;
      cursor: default;
    }

    .card-tag:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Estados vacíos */
    .empty {
      padding: 60px 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    .page-footer {
      margin-top: 80px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-brand {
      font-family: 'Playfair Display', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(245,240,232,0.2);
    }

    .footer-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-back:hover { color: var(--gold); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav { padding: 16px 24px; }
      .page { padding: 96px 0 72px; }
      .inner { padding: 0 24px; }

      .timeline::before { left: 24px; }
      .card { padding-left: 44px; }
      .card::before { left: calc(24px - 4px); }
      .card-body, .card-expanded { padding-right: 0; }

      .toolbar { flex-direction: column; align-items: flex-start; }
      .page-footer { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .page-title { font-size: 2rem; }
      .card-title  { font-size: 1.1rem; }
      .card { padding-top: 24px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>

  <!-- Nav fija -->
  <nav class="nav">
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al análisis
    </a>
    <span class="nav-brand">EE.UU. vs Irán</span>
  </nav>

  <main class="page">
    <div class="inner">

      <!-- Header -->
      <header class="page-header">
        <span class="page-eyebrow">Documentación cronológica</span>
        <h1 class="page-title">Timeline de <em>Eventos</em></h1>
        <p class="page-subtitle">Registro editorial del conflicto EE.UU.–Irán — hechos, análisis y actualizaciones ordenados cronológicamente.</p>
        <span class="page-rule"></span>
      </header>

      <!-- Toolbar (contador + filtros) -->
      <div class="toolbar" id="toolbar">
        <div class="counter">
          <span class="counter-num" id="counter-num">—</span>
          <span class="counter-label" id="counter-label">eventos</span>
        </div>
        <div class="filters" id="filters"></div>
      </div>

      <!-- Lista de noticias -->
      <div class="timeline" id="timeline"></div>

      <!-- Footer -->
      <footer class="page-footer">
        <span class="footer-brand">EE.UU. vs Irán — Tato Warthon</span>
        <a href="index.html" class="footer-back">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Volver al análisis completo
        </a>
      </footer>

    </div>
  </main>

  <script src="js/news.js"></script>

</body>
</html>
